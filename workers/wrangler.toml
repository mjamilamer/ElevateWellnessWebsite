name = "amermed-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "amermed-production"
database_id = "YOUR_DATABASE_ID" # Replace with actual D1 database ID

# KV Namespace for rate limiting (optional)
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_KV_NAMESPACE_ID" # Replace with actual KV namespace ID

# Environment Variables
[vars]
ENVIRONMENT = "production"
SITE_BASE_URL = "https://amermed.com"

# Secrets (set via: wrangler secret put SECRET_NAME)
# - CAL_WEBHOOK_SECRET
# - ADMIN_SESSION_SECRET
# - SMTP_SERVER
# - SMTP_USER
# - SMTP_PASS

# Development settings
[env.dev]
name = "amermed-api-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "amermed-dev"
database_id = "YOUR_DEV_DATABASE_ID"

[env.dev.vars]
ENVIRONMENT = "development"
SITE_BASE_URL = "http://localhost:3000"
